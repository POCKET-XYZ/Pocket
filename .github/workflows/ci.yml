name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: new advisories appear without new commits.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Reads the bun version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # GHSA-vfj7-8cjw-p6xm (braces): no fixed version is published yet, and
      # braces only runs at build time (shadcn and the Next ESLint plugin, via
      # fast-glob), never in the API or in users' browsers. Drop the ignore
      # once a fix ships.
      - run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a key committed and deleted is still leaked.
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks program itself, not gitleaks-action: the action needs a
      # paid license on organization repos. Same scanner, same .gitleaks.toml.
      # The download is checked against the published checksum before use.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
